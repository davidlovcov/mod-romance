# mod-true-companion: recommended Playerbots settings
#
# Copy these lines into your playerbots.conf (usually env/dist/etc/modules/playerbots.conf),
# replacing the existing lines with the same name, then restart the worldserver.
# Only the settings that differ from the Playerbots defaults are listed; everything else stays as it is.
# Why each one matters: docs/INSTALLATION.md, "Recommended Playerbots settings".

# Party chat with companions must not open trade windows ("how many more to kill?").   Default: 1
Playerbots.EnableAutoTradeOnItemMention = 0

# Companions loot their own quest items and really finish their quests (questing together, lead mode).
# mod-true-companion gives them the quests you accept itself (TrueCompanion.Control.QuestSync).       Default: 1
Playerbots.SyncQuestWithPlayer = 0

# No random small talk between your companion's lines.                                  Default: 1
Playerbots.RandomBotTalk = 0

# No "Using potion..." lines.                                                           Default: 1
Playerbots.AnnounceConsumableUse = 0

# No reagent complaints.                                                                Default: 1
Playerbots.TellWhenMissingBuffReagents = 0

# Optional: random bots stop announcing loot, quests and level-ups in public channels.  Default: 1
Playerbots.EnableBroadcasts = 0
